# 托管 Vue 静态资源，并把 /api/v1 反代到后端（与开发时 Vite proxy 同思路）
#
# 多副本 backend（--scale backend=N）：
#   - server ... resolve：用 Docker 内置 DNS 运行时动态解析，副本增减无需重载
#     （需 nginx >= 1.27.3；Dockerfile.frontend 已锁 1.28-alpine）；
#   - least_conn：按活动连接数选副本，长连接/SSE 场景比纯轮询更均衡（忙闲感知）；
#   - max_fails/fail_timeout：被动健康检查，连续失败即摘除并在窗口内不再选中；
#   - keepalive：复用后端连接，降低 jobs 轮询等短请求的 TIME_WAIT。
# resolver 置于 http 上下文（conf.d 被 include 进 http），供 upstream 动态解析使用。
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend_up {
    zone backend_up 64k;
    least_conn;
    server backend:9999 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_static on;

    location /api/v1/ {
        proxy_pass http://backend_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # 副本骤停时，动态解析的 peer 可能短暂留在 upstream 列表中（连接被黑洞，无 RST）；
        # 收紧连接超时让失败快速计入 max_fails，并由默认 proxy_next_upstream(error timeout)
        # 自动重试其余副本，避免默认 60s 超时造成客户端 499/502（实测 120 并发骤停副本：60s→0 失败）。
        proxy_connect_timeout 2s;
        # SSE 对话流：关闭缓冲并拉长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
