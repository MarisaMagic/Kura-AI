# 一键部署：复用 docker-compose.yml 的数据库，并启动后端 + Nginx 前端。
# 用法（项目根目录，需先有 .env）:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 浏览器打开 http://localhost:${WEB_PORT:-8088}

include:
  - path: docker-compose.yml

services:
  # API 服务：无固定 container_name，可用 --scale backend=N 多副本（nginx 轮询负载均衡）
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    env_file:
      - .env
    environment:
      # 覆盖本机开发用的 127.0.0.1 地址，改为 Docker 网络内主机名
      UVICORN_HOST: "0.0.0.0"
      # 单容器内多 uvicorn 进程数；推荐「每容器 1 进程 + --scale backend=N」由 nginx 轮询扩展
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-langchain_app}
      ADMIN_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-langchain_app}
      REDIS_URL: redis://redis:6379/0
      MILVUS_HOST: standalone
      MILVUS_PORT: "19530"
      AUTH_TRUST_X_FORWARDED_FOR: "true"
      # 同域反代时留空；公网可在 .env 设 PROD_PUBLIC_API_BASE=https://your.domain
      PUBLIC_API_BASE: ${PROD_PUBLIC_API_BASE:-}
      # 对象存储：Docker 网络内指向 minio-app 容器
      S3_ENDPOINT: minio-app:9000
      S3_SECURE: "false"
      S3_BUCKET: ${S3_BUCKET:-kura-user-files}
      S3_ACCESS_KEY: ${MINIO_APP_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_APP_ROOT_PASSWORD}
      # 文档上传受理后进入 Redis 队列，由 kb-worker 独立进程处理（不再占用 API 进程）
      KB_UPLOAD_MODE: "queue"
      # Redis Stream 消费者组（推荐）；需回滚到旧 List 可靠队列时改为 "list"
      KB_UPLOAD_QUEUE_BACKEND: "stream"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      standalone:
        condition: service_healthy
      minio-app:
        condition: service_healthy
    restart: unless-stopped

  # 文档解析/向量化独立进程：与 API 隔离，队列消费 + 崩溃恢复 + 优雅退出。
  # 无固定 container_name，可用 --scale kb-worker=N 横向扩展（队列与处理锁均跨副本安全）。
  kb-worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    command: ["python", "worker.py"]
    env_file:
      - .env
    environment:
      UVICORN_HOST: "0.0.0.0"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-langchain_app}
      ADMIN_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-langchain_app}
      REDIS_URL: redis://redis:6379/0
      MILVUS_HOST: standalone
      MILVUS_PORT: "19530"
      AUTH_TRUST_X_FORWARDED_FOR: "true"
      PUBLIC_API_BASE: ${PROD_PUBLIC_API_BASE:-}
      S3_ENDPOINT: minio-app:9000
      S3_SECURE: "false"
      S3_BUCKET: ${S3_BUCKET:-kura-user-files}
      S3_ACCESS_KEY: ${MINIO_APP_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_APP_ROOT_PASSWORD}
      KB_UPLOAD_MODE: "queue"
      KB_UPLOAD_QUEUE_BACKEND: "stream"
    # worker 不监听 HTTP 端口，禁用镜像自带的 API healthcheck（否则容器恒为 unhealthy）
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      standalone:
        condition: service_healthy
      minio-app:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    container_name: kura-ai-frontend
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
